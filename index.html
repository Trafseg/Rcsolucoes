<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#222A30"><meta name="robots" content="noindex,nofollow">
<title>Diagnóstico Gratuito | RC Soluções em Segurança</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#222A30;--card:#2b343c;--border:#3b4751;--accent:#E6B400;--text:#ffffff;--muted:#aab5bd;--green:#25D366}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--text);background:var(--bg);min-height:100svh}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
[hidden]{display:none!important}
.shell{max-width:900px;margin:auto;padding:24px 28px;min-height:100svh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.brand img{width:120px;height:120px;object-fit:contain;display:block}
.label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:8px 12px;border-radius:99px}
.form-headline{font-size:clamp(20px,3vw,28px);font-weight:800;text-align:center;margin:26px 0 0;line-height:1.3;letter-spacing:-.5px}
.accent{color:var(--accent)}
.progress-area{margin-top:22px}
.progress-meta{display:flex;justify-content:flex-end;font-size:11px;color:var(--muted);margin-bottom:8px}
.track{height:4px;background:var(--border);border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .35s}
main{flex:1;display:flex;align-items:center;padding:36px 0}
.screen{width:100%;max-width:640px;margin:auto;animation:enter .35s ease}
.step-label{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center}
.step-label b{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:rgba(230,180,0,.15);margin-right:8px}
h2{font-size:clamp(19px,2.6vw,27px);letter-spacing:-.8px;line-height:1.25;margin:16px 0 14px;font-weight:800}
h2:focus{outline:none}
.desc{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 20px}
.field{width:100%;background:transparent;border:0;border-bottom:2px solid var(--border);border-radius:0;padding:12px 0;color:var(--text);font-size:clamp(18px,2.6vw,24px);outline:none;transition:border-color .2s}
.field::placeholder{color:#6f7d87}
.field:focus{border-color:var(--accent)}
.field[aria-invalid=true]{border-color:#ff8a8a}
.options{display:grid;gap:10px}
.option{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;line-height:1.5;transition:border-color .2s,background .2s}
.option:hover{border-color:var(--accent)}
.option[aria-checked=true]{border-color:var(--accent);background:rgba(230,180,0,.1)}
.key{flex-shrink:0;border:1px solid #4a5a66;border-radius:6px;width:26px;height:26px;display:grid;place-items:center;color:var(--accent);font-size:11px;font-weight:700}
.option[aria-checked=true] .key{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.check{margin-left:auto;color:var(--accent);visibility:hidden}
.option[aria-checked=true] .check{visibility:visible}
.actions{display:flex;align-items:center;gap:16px;margin-top:22px}
.primary{display:inline-flex;justify-content:center;align-items:center;gap:10px;border:0;background:var(--accent);color:var(--bg);font-size:14px;font-weight:700;padding:15px 22px;border-radius:12px;text-decoration:none;transition:filter .2s}
.primary:hover{filter:brightness(1.08)}
.primary.whats{background:var(--green);color:#072812}
.error{color:#ff8a8a;font-size:12px;min-height:18px;margin:10px 0 0}
.micro{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border);padding-top:16px;margin-top:8px;color:var(--muted);font-size:10px;flex-wrap:wrap}
.back,.restart{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:8px 12px;font-size:11px}
.back:hover,.restart:hover{color:var(--text);border-color:var(--accent)}
.thanks{text-align:center}
.thanks .step-label{justify-content:center}
.thanks .desc{max-width:520px;margin:0 auto 22px}
.thanks .primary{width:100%;max-width:420px}
.success{width:60px;height:60px;margin:0 auto 18px;display:grid;place-items:center;border-radius:16px;background:rgba(230,180,0,.12);border:1px solid rgba(230,180,0,.4);font-size:26px;color:var(--accent)}
.summary{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin:22px 0}
.summary h3{font-size:12px;color:var(--accent);margin:0 0 10px}
.summary dl{margin:0}
.summary .row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5}
.summary .row:last-child{border:0}
.summary dt{color:var(--muted)}
.summary dd{margin:0;overflow-wrap:anywhere}
.restart{margin-top:6px}
.carrossel{position:relative;width:100%;max-width:400px;margin:0 auto;aspect-ratio:4/5;overflow:hidden;border-radius:14px;border:1px solid var(--border);background:var(--card)}
.carrossel-trilho{display:flex;height:100%;transition:transform .45s ease}
.carrossel-trilho img{flex:0 0 100%;width:100%;height:100%;object-fit:cover}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(34,42,48,.8);color:var(--text);font-size:22px;line-height:1;display:grid;place-items:center}
.seta.esq{left:8px}
.seta.dir{right:8px}
.pontos{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.ponto{width:8px;height:8px;border-radius:50%;border:0;background:rgba(255,255,255,.5);padding:0}
.ponto[aria-current=true]{background:var(--accent)}
.carrossel + .desc{text-align:center;margin:12px 0 0}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){.shell{padding:18px 18px 22px}.brand img{width:90px;height:90px}.label{display:none}.summary .row{grid-template-columns:100px 1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

const questions=[
 {id:'tipo',resumo:'Imóvel',group:'Seu imóvel',title:'Qual é o tipo do imóvel que você quer proteger?',options:[TIPO_FAZENDA,TIPO_FLORESTAL,TIPO_RESIDENCIA,TIPO_COMERCIO]},
 {id:'service',resumo:'Serviço',group:'Serviço',title:'Qual serviço você procura?',when:ehRural,options:['Alarme e câmeras para a propriedade','Cerca eletrônica','Mais de um serviço','Ainda não sei']},
 {id:'theft',resumo:'Furto ou invasão',group:'Sua propriedade',title:'A propriedade já sofreu furto ou invasão?',when:ehRural,options:['Sim, furto de gado','Sim, furto de equipamentos ou materiais','Tentativa de invasão','Não, quero prevenir']},
 {id:'power',resumo:'Energia',group:'Sua propriedade',title:'O local tem energia elétrica da rede?',when:ehRural,options:['Sim, e é estável','Sim, mas cai com frequência','Não tem energia no local']},
 {id:'area',resumo:'Área',group:'Sua propriedade',title:'Qual é o tamanho aproximado da área?',when:ehRural,options:['Até 5 hectares','De 5 a 20 hectares','Mais de 20 hectares','Não sei informar']},
 {id:'vitrine',tipo:'carrossel',group:'Instalações',title:'Veja instalações como a que você pode ter',when:ehRural},
 {id:'housetype',resumo:'Residência',group:'Sua residência',title:'Qual é o tipo de residência?',when:ehResidencia,options:['Casa','Sobrado','Apartamento ou casa em condomínio','Outro']},
 {id:'protect',resumo:'O que proteger',group:'Sua residência',title:'O que você quer proteger?',when:ehResidencia,options:['Casa inteira (alarme e câmeras)','Apenas câmeras','Portão, muro ou cerca eletrônica','Ainda não sei']},
 {id:'theftRes',resumo:'Furto ou invasão',group:'Sua residência',title:'Você já sofreu furto ou invasão?',when:ehResidencia,options:['Sim, na própria casa','Sim, no meu bairro','Não, quero prevenir']},
 {id:'systemRes',resumo:'Sistema atual',group:'Sua residência',title:'Você já tem algum sistema de segurança?',when:ehResidencia,options:['Não tenho nada instalado','Tenho câmeras sem monitoramento','Tenho alarme sem monitoramento','Tenho empresa e quero trocar']},
 {id:'businessType',resumo:'Tipo de negócio',group:'Seu negócio',title:'Qual é o tipo do seu negócio?',when:ehComercio,options:['Loja ou comércio','Escritório','Galpão ou depósito','Outro']},
 {id:'protectCom',resumo:'O que proteger',group:'Seu negócio',title:'O que você quer proteger?',when:ehComercio,options:['Câmeras','Alarme','Portão ou cerca eletrônica','Mais de um ou ainda não sei']},
 {id:'owner',resumo:'Decisor',group:'Decisão',title:'Você é o proprietário ou quem decide?',options:['Sim','Decido junto com outra pessoa','Não']},
 {id:'urgency',resumo:'Prazo',group:'Prazo',title:'Qual é o prazo para implantar a solução?',options:['Com urgência','Nas próximas 2 a 3 semanas','Apenas pesquisando por enquanto']},
 {id:'location',resumo:'Localização',group:'Localização',title:'Onde fica o imóvel?',desc:'Informe a localidade ou bairro e o município.',label:'Localidade ou bairro e município',placeholder:'Ex.: Centro, São Francisco de Paula',autocomplete:'off'},
 {id:'name',resumo:'Nome',group:'Seus dados',title:'Como podemos chamar você?',label:'Nome completo',placeholder:'Digite seu nome',autocomplete:'name'},
 {id:'phone',resumo:'WhatsApp',group:'Seus dados',title:'Qual é o seu WhatsApp com DDD para enviarmos a estimativa?',label:'WhatsApp com DDD',placeholder:'(54) 99999-9999',autocomplete:'tel-national',type:'tel'}
];
const answers={};let step=0;let autoAdvanceTimer=null;
const main=document.getElementById('main'),back=document.getElementById('back');
const perguntasAtivas=()=>questions.filter(q=>!q.when||q.when(answers));
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function focusTitle(){main.querySelector('h2')?.focus({preventScroll:true});window.scrollTo({top:0});}
function render(){
 clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;
 clearInterval(carrosselTimer);carrosselTimer=null;
 const lista=perguntasAtivas(),total=lista.length,finished=step>=total,completed=Math.min(step,total);
 const pct=Math.round(completed/total*100);
 document.getElementById('progressPercent').textContent=pct+'%';
 document.getElementById('fill').style.width=pct+'%';
 const barra=document.querySelector('[role=progressbar]');
 barra.setAttribute('aria-valuenow',completed);barra.setAttribute('aria-valuemax',total);
 back.hidden=step===0;
 if(finished)renderFinal(lista);else renderQuestion(lista[step]);
 focusTitle();
}
function renderQuestion(q){
 if(q.tipo==='carrossel')return renderCarrossel(q);
 const corpo=q.options
  ?`<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map((opcao,i)=>`<button type="button" class="option" role="radio" aria-checked="${answers[q.id]===opcao}" data-index="${i}" tabindex="${answers[q.id]===opcao||(!answers[q.id]&&i===0)?0:-1}"><span class="key" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${esc(opcao)}</span><span class="check" aria-hidden="true">✓</span></button>`).join('')}</div>`
  :`<input class="field" id="answer" aria-label="${esc(q.label)}" aria-describedby="description error" type="${q.type||'text'}" ${q.type==='tel'?'inputmode="tel"':''} autocomplete="${q.autocomplete}" maxlength="${q.type==='tel'?20:120}" placeholder="${esc(q.placeholder)}" value="${esc(answers[q.id])}" required>`;
 main.innerHTML=`<section class="screen"><div class="step-label"><b>${step+1}</b>${esc(q.group)}</div><h2 id="questionTitle" tabindex="-1">${esc(q.title)}</h2>${q.desc?`<p class="desc" id="description">${esc(q.desc)}</p>`:''}<form id="questionForm" novalidate>${corpo}<p class="error" id="error" role="alert"></p><div class="actions"><button class="primary" type="submit">${step===perguntasAtivas().length-1?'Concluir diagnóstico':'Continuar'} →</button></div></form></section>`;
 if(q.options){
  main.querySelectorAll('.option').forEach(botao=>botao.onclick=()=>selectOption(Number(botao.dataset.index)));
 }else{
  const input=document.getElementById('answer');
  input.addEventListener('input',()=>{answers[q.id]=input.value;input.removeAttribute('aria-invalid');document.getElementById('error').textContent='';});
  if(q.type==='tel')input.addEventListener('input',()=>{
   let digits=input.value.replace(/\D/g,'');
   if(digits.startsWith('55')&&digits.length>11)digits=digits.slice(2);
   digits=digits.slice(0,11);
   input.value=digits.length>2?'('+digits.slice(0,2)+') '+digits.slice(2,digits.length>10?7:6)+(digits.length>6?'-'+digits.slice(digits.length>10?7:6):''):digits;
   answers[q.id]=input.value;
  });
 }
 document.getElementById('questionForm').onsubmit=evento=>{evento.preventDefault();advance();};
}
function renderCarrossel(q){
 main.innerHTML=`<section class="screen"><div class="step-label"><b>${step+1}</b>${esc(q.group)}</div><h2 id="questionTitle" tabindex="-1">${esc(q.title)}</h2><div class="carrossel"><div class="carrossel-trilho" id="trilho">${FOTOS.map((foto,i)=>`<img src="${foto}" alt="Instalação rural feita pela RC, foto ${i+1}" loading="${i?'lazy':'eager'}">`).join('')}</div><button type="button" class="seta esq" id="antes" aria-label="Foto anterior">‹</button><button type="button" class="seta dir" id="depois" aria-label="Próxima foto">›</button><div class="pontos">${FOTOS.map((_,i)=>`<button type="button" class="ponto" data-i="${i}" aria-label="Ver foto ${i+1}"></button>`).join('')}</div></div><p class="desc">Instalações feitas pela RC em propriedades rurais.</p><div class="actions"><button class="primary" type="button" id="avancar">Continuar →</button></div></section>`;
 let atual=0;
 const trilho=document.getElementById('trilho');
 const pontos=main.querySelectorAll('.ponto');
 const irPara=i=>{
  atual=(i+FOTOS.length)%FOTOS.length;
  trilho.style.transform=`translateX(-${atual*100}%)`;
  pontos.forEach((p,j)=>p.setAttribute('aria-current',j===atual));
 };
 irPara(0);
 document.getElementById('antes').onclick=()=>irPara(atual-1);
 document.getElementById('depois').onclick=()=>irPara(atual+1);
 pontos.forEach(p=>p.onclick=()=>irPara(Number(p.dataset.i)));
 document.getElementById('avancar').onclick=advance;
 if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)carrosselTimer=setInterval(()=>irPara(atual+1),4500);
}
function selectOption(index){
 const q=perguntasAtivas()[step];
 if(!q?.options?.[index])return;
 answers[q.id]=q.options[index];
 main.querySelectorAll('.option').forEach((botao,i)=>{botao.setAttribute('aria-checked',i===index);botao.tabIndex=i===index?0:-1;});
 document.getElementById('error').textContent='';
 clearTimeout(autoAdvanceTimer);
 const etapaSelecionada=step;
 autoAdvanceTimer=setTimeout(()=>{autoAdvanceTimer=null;if(step===etapaSelecionada)advance();},400);
}
function advance(){
 const q=perguntasAtivas()[step];
 if(q.tipo==='carrossel'){clearInterval(carrosselTimer);carrosselTimer=null;step++;render();return;}
 const value=(answers[q.id]||'').trim();
 let error='';
 if(!value)error=q.options?'Selecione uma opção para continuar.':'Preencha este campo para continuar.';
 else if(q.id==='phone'&&!/^[1-9]{2}\d{8,9}$/.test(value.replace(/\D/g,'')))error='Informe um número válido com DDD (10 ou 11 dígitos).';
 else if(q.id==='location'&&value.length<4)error='Informe a localidade ou bairro e o município.';
 if(error){
  document.getElementById('error').textContent=error;
  const input=document.getElementById('answer');
  if(input){input.setAttribute('aria-invalid','true');input.focus();}
  return;
 }
 answers[q.id]=value;
 step++;
 render();
}
function renderFinal(lista){
 const rows=lista.filter(q=>q.resumo&&answers[q.id]).map(q=>[q.resumo,answers[q.id]]);
 const message='Olá, RC Soluções em Segurança! Fiz o diagnóstico no site e gostaria de receber uma estimativa.\n\n'+rows.map(([label,valor])=>label+': '+valor).join('\n');
 const waLink=(WHATSAPP_NUMERO?'https://wa.me/'+WHATSAPP_NUMERO:'https://wa.me/')+'?text='+encodeURIComponent(message);
 const digitosLead=(answers.phone||'').replace(/\D/g,'');
 const leadWaLink=digitosLead?'https://wa.me/55'+digitosLead:'';
 if(PLANILHA_WEBHOOK){
  const dados={};
  lista.forEach(q=>dados[q.id]=answers[q.id]||'');
  fetch(PLANILHA_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...dados,whatsappLink:leadWaLink})}).catch(()=>{});
 }
 const primeiroNome=answers.name.trim().split(/\s+/)[0];
 main.innerHTML=`<section class="screen thanks"><div class="success" aria-hidden="true">✓</div><div class="step-label">Tudo pronto para o próximo passo</div><h2 tabindex="-1">Diagnóstico concluído, ${esc(primeiroNome)}!</h2><p class="desc">Analisamos as melhores opções de segurança para a sua propriedade em ${esc(answers.location)}. Clique abaixo para receber sua estimativa no WhatsApp com um dos nossos consultores.</p><a class="primary whats" id="whatsapp" href="${esc(waLink)}" target="_blank" rel="noopener noreferrer">Falar agora com a RC no WhatsApp</a><p class="micro">O atendimento começa após você enviar a mensagem no WhatsApp.</p><div class="summary"><h3>CONFIRA SUAS RESPOSTAS</h3><dl>${rows.map(([label,valor])=>`<div class="row"><dt>${esc(label)}</dt><dd>${esc(valor)}</dd></div>`).join('')}</dl></div><button class="restart" id="restart" type="button">Recomeçar diagnóstico</button></section>`;
 document.getElementById('restart').onclick=()=>{for(const chave of Object.keys(answers))delete answers[chave];step=0;render();};
}
back.onclick=()=>{if(step>0){step--;render();}};
document.addEventListener('keydown',evento=>{
 if(evento.ctrlKey||evento.altKey||evento.metaKey||evento.target.matches('input,textarea'))return;
 const q=perguntasAtivas()[step];
 if(!q?.options)return;
 const tecla=evento.key.toUpperCase();
 if(/^[A-D]$/.test(tecla)){
  const index=tecla.charCodeAt(0)-65;
  if(index<q.options.length){evento.preventDefault();selectOption(index);}
 }
});
render();
</script>
</body>
</html>
